name: Build RP2040 UF2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
      - name: Install Earle Philhower Arduino-Pico core
        run: |
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
      - name: Compile firmware
        run: |
          mkdir -p dist
          arduino-cli compile --fqbn rp2040:rp2040:rpipico --output-dir dist firmware/pico_bluejay_passthrough
          uf2="$(find dist -maxdepth 1 -type f -name '*.uf2' -print -quit)"
          test -n "$uf2"
          mv "$uf2" dist/pico-bluejay-configurator-pico.uf2
          ls -lah dist/pico-bluejay-configurator-pico.uf2
      - name: Upload UF2 to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-bluejay-configurator-rp2040
          path: dist/pico-bluejay-configurator-pico.uf2
          if-no-files-found: error
      # Make the UF2 accessible directly from the repository's README.
      # Unlike workflow artifacts, GitHub Release assets do not expire automatically.
      - name: Publish stable UF2 download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view pico-latest >/dev/null 2>&1; then
            gh release create pico-latest --target "$GITHUB_SHA" \
              --title "Pico UF2 (latest build)" \
              --notes "RP2040 Bluejay configurator USB/4-way passthrough. Experimental ESC write support; initial tests should read settings only. GPIO: FR=15, FL=14, RR=3, RL=2." \
              --latest
          fi
          gh release upload pico-latest dist/pico-bluejay-configurator-pico.uf2 --clobber
          gh release view pico-latest --json assets --jq '.assets[].name'
